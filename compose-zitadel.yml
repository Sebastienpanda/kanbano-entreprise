services:
    zitadel:
        image: ghcr.io/zitadel/zitadel:latest
        restart: unless-stopped
        command: >
            start-from-init
            --masterkey "${ZITADEL_MASTERKEY}"
            --tlsMode external

        environment:
            # =========================
            # External URL (Traefik HTTPS)
            # =========================
            ZITADEL_EXTERNALDOMAIN: zitadel.kanbano.fr
            ZITADEL_EXTERNALSECURE: true
            ZITADEL_EXTERNALPORT: 443

            # =========================
            # Database
            # =========================
            ZITADEL_DATABASE_POSTGRES_HOST: db
            ZITADEL_DATABASE_POSTGRES_PORT: 5432
            ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
            ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
            ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "${POSTGRES_PASSWORD}"
            ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
            ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
            ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "${POSTGRES_PASSWORD}"
            ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable

            # =========================
            # Login v2
            # =========================
            ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
            ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://zitadel.kanbano.fr/ui/v2/login

            ZITADEL_OIDC_DEFAULTLOGINURLV2: https://zitadel.kanbano.fr/ui/v2/login/login?authRequest=
            ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://zitadel.kanbano.fr/ui/v2/login/logout?post_logout_redirect=
            ZITADEL_SAML_DEFAULTLOGINURLV2: https://zitadel.kanbano.fr/ui/v2/login/login?samlRequest=

            # =========================
            # Login client token
            # =========================
            ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /current-dir/login-client.pat
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false

        volumes:
            - zitadel_data:/current-dir

        healthcheck:
            test:
                - CMD
                - /app/zitadel
                - ready
            interval: 10s
            timeout: 60s
            retries: 5
            start_period: 20s

        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.zitadel.rule=Host(`zitadel.kanbano.fr`)"
            - "traefik.http.routers.zitadel.entrypoints=websecure"
            - "traefik.http.routers.zitadel.tls.certresolver=letsencrypt"
            - "traefik.http.services.zitadel.loadbalancer.server.port=8080"

        networks:
            - dokploy-network

        depends_on:
            db:
                condition: service_healthy

    login:
        image: ghcr.io/zitadel/zitadel-login:latest
        restart: unless-stopped

        environment:
            ZITADEL_API_URL: http://zitadel:8080
            NEXT_PUBLIC_BASE_PATH: /ui/v2/login
            ZITADEL_SERVICE_USER_TOKEN_FILE: /current-dir/login-client.pat

        volumes:
            - zitadel_data:/current-dir:ro

        networks:
            - dokploy-network

        depends_on:
            zitadel:
                condition: service_healthy

    db:
        image: postgres:17-alpine
        restart: unless-stopped

        environment:
            POSTGRES_DB: zitadel
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

        volumes:
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d zitadel" ]
            interval: 10s
            timeout: 30s
            retries: 5

        networks:
            - dokploy-network

volumes:
    postgres_data:
    zitadel_data:

networks:
    dokploy-network:
        external: true
