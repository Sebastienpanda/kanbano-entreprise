services:
    traefik:
        image: traefik:v3.0
        container_name: traefik
        command:
            - "--api.dashboard=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedByDefault=false"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
            - "--certificatesresolvers.myresolver.acme.email=sebastienprodev@gmail.com"
            - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
            - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
            - "./letsencrypt:/letsencrypt"
        restart: always

    kanbano:
        build:
            context: .
            dockerfile: ./apps/kanbano/Dockerfile
        container_name: kanbano
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.kanbano.rule=Host(`kanbano.fr`)"
            - "traefik.http.routers.kanbano.entrypoints=websecure"
            - "traefik.http.routers.kanbano.tls.certresolver=myresolver"
            - "traefik.http.services.kanbano.loadbalancer.server.port=80"
        restart: always
networks:
    traefik-network:
        driver: bridge
