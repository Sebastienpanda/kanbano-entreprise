services:
    newsletters:
        build:
            context: .
            dockerfile: ./apps/newsletters/Dockerfile
        container_name: newsletters

        env_file: [ ]

        environment:
            NODE_ENV: ${NODE_ENV}
            PORT: ${PORT}
            SMTP_HOST: ${SMTP_HOST}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_USER: ${SMTP_USER}
            SMTP_PASS: ${SMTP_PASS}
            SMTP_FROM: ${SMTP_FROM}


        expose:
            - "3000"

        labels:
            - "traefik.enable=true"

            # Router HTTPS
            - "traefik.http.routers.newsletters.rule=Host(`api.kanbano.fr`)"
            - "traefik.http.routers.newsletters.entrypoints=websecure"
            - "traefik.http.routers.newsletters.tls.certresolver=letsencrypt"

            # Service interne (port du container)
            - "traefik.http.services.newsletters.loadbalancer.server.port=3000"

        networks:
            - dokploy-network

        restart: unless-stopped

networks:
    dokploy-network:
        external: true
