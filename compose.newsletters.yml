services:
    newsletters:
        build:
            context: .
            dockerfile: ./apps/newsletters/Dockerfile
        container_name: newsletters

        environment:
            PORT: "3000"
            NODE_ENV: "PRODUCTION"
            SMTP_HOST: "mail.infomaniak.com"
            SMTP_PORT: "587"
            SMTP_USER: "contact@kanbano.fr"
            SMTP_PASS: "{jT8OVYK&b~bNxZ]"
            SMTP_FROM: "Kanbano contact@kanbano.fr"


        expose:
            - "3000"

        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.newsletters.rule=Host(`api.kanbano.fr`)"
            - "traefik.http.routers.newsletters.entrypoints=websecure"
            - "traefik.http.routers.newsletters.tls.certresolver=letsencrypt"
            - "traefik.http.services.newsletters.loadbalancer.server.port=3000"

        networks:
            - dokploy-network

        restart: unless-stopped

networks:
    dokploy-network:
        external: true
